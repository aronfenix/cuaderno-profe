<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Cuaderno del Profe</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14213d;
        --muted: #5f6f89;
        --line: #dbe4f0;
        --brand: #1f6feb;
        --danger: #c2410c;
        --bg: #f7f1e8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 20%, rgba(31, 111, 235, 0.16), transparent 30%),
          radial-gradient(circle at 90% 15%, rgba(194, 65, 12, 0.12), transparent 28%),
          linear-gradient(135deg, #fffaf1, var(--bg));
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
        margin: 0 auto;
        padding: 24px;
        border: 1px solid rgba(20, 33, 61, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 70px rgba(20, 33, 61, 0.14);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 9vw, 3.25rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        font: inherit;
        background: white;
      }

      button {
        display: inline-flex;
        justify-content: center;
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 18px;
        padding: 15px 18px;
        color: white;
        background: var(--brand);
        font: 800 1rem system-ui, sans-serif;
      }

      button.secondary { background: var(--danger); }
      button:disabled { opacity: 0.6; }

      #status {
        min-height: 48px;
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(31, 111, 235, 0.08);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rescate del movil</h1>
      <p>
        Esta pagina escribe directamente la copia buena del servidor en este navegador.
        No depende de que la app arranque primero.
      </p>

      <label for="apiBaseUrl">Servidor</label>
      <input id="apiBaseUrl" value="https://cuaderno-profe-sync.cuaderno-alvar-x100.workers.dev" />

      <label for="spaceId">Espacio docente</label>
      <input id="spaceId" placeholder="peru_2025_sexto" />

      <label for="secret">Clave</label>
      <input id="secret" type="password" autocomplete="off" />

      <button id="restore">Meter copia buena en este movil</button>
      <button id="openApp" class="secondary">Abrir app</button>

      <div id="status">Listo para recuperar.</div>
    </main>

    <script>
      const DEFAULT_API = 'https://cuaderno-profe-sync.cuaderno-alvar-x100.workers.dev'
      const DB_NAME = 'CuadernoProfe'
      const DB_VERSION = 5
      const FORCE_KEY = 'cuaderno_force_cloud_restore'
      const SETTINGS_KEY = 'cloudSyncSettings'
      const META_KEY = 'cloudSyncMeta'
      const INIT_KEY = 'cuaderno_initialized'

      const STORES = {
        academicYears: ['name', 'isActive', 'syncStatus'],
        classGroups: ['yearId', 'name', 'syncStatus'],
        students: ['displayName', 'syncStatus'],
        enrollments: ['studentId', 'groupId', 'yearId', '[studentId+groupId]'],
        subjects: ['yearId', 'name', 'syncStatus'],
        studentNotes: ['studentId', 'subjectId', 'groupId', 'noteType', 'isResolved', 'createdAt', 'updatedAt'],
        checklists: ['groupId', 'yearId', 'subjectId', 'kind', 'date', 'updatedAt', 'syncStatus', '[groupId+date]'],
        checklistEntries: ['sessionId', 'studentId', 'value', 'updatedAt', '[sessionId+studentId]'],
        teamArrangements: ['groupId', 'yearId', 'name', 'isArchived', 'updatedAt', 'syncStatus'],
        teams: ['groupId', 'yearId', 'arrangementId', 'name', 'isArchived', 'updatedAt', 'syncStatus'],
        teamMemberships: ['teamId', 'studentId', '[teamId+studentId]'],
        templates: ['title', 'source', 'syncStatus', 'updatedAt'],
        assessments: ['groupId', 'subjectId', 'teamArrangementId', 'templateId', 'snapshotId', 'status', 'date', 'updatedAt', 'syncStatus'],
        snapshots: ['templateId', 'assessmentId'],
        results: ['assessmentId', 'studentId', 'status', 'syncStatus', 'updatedAt', '[assessmentId+studentId]'],
        criterionScores: ['resultId', 'criterionId', '[resultId+criterionId]'],
      }

      const STORE_ORDER = Object.keys(STORES)

      const BACKUP_KEYS = {
        academicYears: 'academicYears',
        classGroups: 'classGroups',
        students: 'students',
        enrollments: 'enrollments',
        subjects: 'subjects',
        studentNotes: 'studentNotes',
        checklists: 'checklists',
        checklistEntries: 'checklistEntries',
        teamArrangements: 'teamArrangements',
        teams: 'teams',
        teamMemberships: 'teamMemberships',
        templates: 'templates',
        assessments: 'assessments',
        snapshots: 'snapshots',
        results: 'results',
        criterionScores: 'criterionScores',
      }

      const apiBaseUrl = document.getElementById('apiBaseUrl')
      const spaceId = document.getElementById('spaceId')
      const secret = document.getElementById('secret')
      const restore = document.getElementById('restore')
      const openApp = document.getElementById('openApp')
      const status = document.getElementById('status')

      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')
        apiBaseUrl.value = saved.apiBaseUrl || DEFAULT_API
        spaceId.value = saved.spaceId || ''
        secret.value = saved.secret || ''
      } catch {
        apiBaseUrl.value = DEFAULT_API
      }

      function setStatus(message) {
        status.textContent = message
      }

      function endpoint(path) {
        const base = (apiBaseUrl.value || DEFAULT_API).trim().replace(/\/+$/, '')
        if (base.endsWith('/api/cloud')) return `${base}/${path}`
        if (base.endsWith('/api')) return `${base}/cloud/${path}`
        return `${base}/api/cloud/${path}`
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          apiBaseUrl: (apiBaseUrl.value || DEFAULT_API).trim(),
          spaceId: spaceId.value.trim(),
          secret: secret.value,
          autoSync: true
        }))
        localStorage.removeItem(FORCE_KEY)
        localStorage.removeItem(META_KEY)
        localStorage.setItem(INIT_KEY, '1')
      }

      async function clearCaches() {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations().catch(() => [])
          await Promise.all(registrations.map(registration => registration.unregister().catch(() => undefined)))
        }
        if ('caches' in window) {
          const keys = await caches.keys().catch(() => [])
          await Promise.all(keys.map(key => caches.delete(key).catch(() => undefined)))
        }
      }

      async function fetchBackup() {
        const url = `${endpoint('load')}?spaceId=${encodeURIComponent(spaceId.value.trim())}&secret=${encodeURIComponent(secret.value)}&t=${Date.now()}`
        const response = await fetch(url, { cache: 'no-store' })
        const payload = await response.json()
        if (!response.ok) throw new Error(payload && payload.error ? payload.error : 'No se pudo leer el servidor')
        if (!payload || !payload.backup || !Array.isArray(payload.backup.students)) {
          throw new Error('El servidor no devolvio una copia valida')
        }
        return { backup: payload.backup, updatedAt: Number(payload.updatedAt || Date.now()) }
      }

      function createIndex(store, indexSpec) {
        const isCompound = indexSpec.startsWith('[') && indexSpec.endsWith(']')
        const keyPath = isCompound ? indexSpec.slice(1, -1).split('+') : indexSpec
        if (!store.indexNames.contains(indexSpec)) {
          store.createIndex(indexSpec, keyPath)
        }
      }

      function ensureSchema(db, transaction) {
        for (const [storeName, indexes] of Object.entries(STORES)) {
          let store
          if (!db.objectStoreNames.contains(storeName)) {
            store = db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true })
          } else if (transaction) {
            store = transaction.objectStore(storeName)
          }

          if (store) {
            indexes.forEach(indexSpec => createIndex(store, indexSpec))
          }
        }
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION)
          request.onupgradeneeded = event => ensureSchema(request.result, event.target.transaction)
          request.onsuccess = () => resolve(request.result)
          request.onerror = () => reject(request.error)
          request.onblocked = () => reject(new Error('La base local esta bloqueada. Cierra otras pestanas de la app y vuelve a intentarlo.'))
        })
      }

      function requestToPromise(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result)
          request.onerror = () => reject(request.error)
        })
      }

      async function replaceLocalData(backup, updatedAt) {
        const db = await openDb()
        const missing = STORE_ORDER.filter(storeName => !db.objectStoreNames.contains(storeName))
        if (missing.length) {
          db.close()
          throw new Error(`Faltan tablas locales: ${missing.join(', ')}`)
        }

        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_ORDER, 'readwrite')
          tx.oncomplete = () => resolve()
          tx.onerror = () => reject(tx.error)
          tx.onabort = () => reject(tx.error || new Error('Importacion abortada'))

          for (const storeName of STORE_ORDER) {
            const store = tx.objectStore(storeName)
            store.clear()
          }

          for (const storeName of STORE_ORDER) {
            const rows = backup[BACKUP_KEYS[storeName]] || []
            const store = tx.objectStore(storeName)
            for (const row of rows) store.put(row)
          }
        })

        db.close()
        localStorage.setItem(META_KEY, JSON.stringify({
          lastCloudUpdatedAt: updatedAt,
          lastLocalDataUpdatedAt: maxBackupTimestamp(backup),
          lastSyncAt: Date.now(),
        }))
      }

      function maxBackupTimestamp(backup) {
        let max = 0
        for (const storeName of STORE_ORDER) {
          const rows = backup[BACKUP_KEYS[storeName]] || []
          for (const row of rows) {
            if (!row || typeof row !== 'object') continue
            max = Math.max(max, Number(row.updatedAt || 0), Number(row.createdAt || 0), Number(row.completedAt || 0))
          }
        }
        return max
      }

      restore.addEventListener('click', async () => {
        if (!spaceId.value.trim() || !secret.value) {
          setStatus('Falta espacio docente o clave.')
          return
        }

        restore.disabled = true
        try {
          setStatus('1/4 Leyendo copia buena del servidor...')
          const { backup, updatedAt } = await fetchBackup()
          const counts = {
            students: (backup.students || []).length,
            groups: (backup.classGroups || []).length,
            templates: (backup.templates || []).length,
          }

          setStatus(`2/4 Servidor OK: ${counts.students} alumnos, ${counts.groups} grupos, ${counts.templates} rubricas. Limpiando caches...`)
          saveSettings()
          await clearCaches()

          setStatus('3/4 Escribiendo la copia buena dentro de este navegador...')
          await replaceLocalData(backup, updatedAt)

          setStatus(`4/4 Listo: ${counts.students} alumnos y ${counts.templates} rubricas cargados. Abriendo app...`)
          setTimeout(() => {
            window.location.href = './?v=9#/'
          }, 1200)
        } catch (error) {
          setStatus(error.message || String(error))
          restore.disabled = false
        }
      })

      openApp.addEventListener('click', () => {
        saveSettings()
        window.location.href = './?v=9#/'
      })
    </script>
  </body>
</html>
