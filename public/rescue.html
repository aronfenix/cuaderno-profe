<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Cuaderno del Profe</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14213d;
        --muted: #5f6f89;
        --line: #dbe4f0;
        --brand: #1f6feb;
        --danger: #c2410c;
        --bg: #f7f1e8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 20%, rgba(31, 111, 235, 0.16), transparent 30%),
          radial-gradient(circle at 90% 15%, rgba(194, 65, 12, 0.12), transparent 28%),
          linear-gradient(135deg, #fffaf1, var(--bg));
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
        margin: 0 auto;
        padding: 24px;
        border: 1px solid rgba(20, 33, 61, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(20, 33, 61, 0.14);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 9vw, 3.25rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        font: inherit;
        background: white;
      }

      button, a.button {
        display: inline-flex;
        justify-content: center;
        width: 100%;
        margin-top: 16px;
        border: 0;
        border-radius: 18px;
        padding: 15px 18px;
        color: white;
        background: var(--brand);
        font: 800 1rem system-ui, sans-serif;
        text-decoration: none;
      }

      button.secondary {
        background: var(--danger);
      }

      button:disabled {
        opacity: 0.6;
      }

      #status {
        min-height: 48px;
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(31, 111, 235, 0.08);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rescate del móvil</h1>
      <p>
        Esta página no carga la app por dentro. Guarda las claves, fuerza la recuperación
        desde servidor y vuelve a abrir el cuaderno con la copia buena.
      </p>

      <label for="apiBaseUrl">Servidor</label>
      <input id="apiBaseUrl" value="https://cuaderno-profe-sync.cuaderno-alvar-x100.workers.dev" />

      <label for="spaceId">Espacio docente</label>
      <input id="spaceId" placeholder="peru_2025_sexto" />

      <label for="secret">Clave</label>
      <input id="secret" type="password" autocomplete="off" />

      <button id="restore">Restaurar este móvil desde servidor</button>
      <button id="openApp" class="secondary">Abrir app sin limpiar</button>

      <div id="status">Listo para recuperar.</div>
    </main>

    <script>
      const DEFAULT_API = 'https://cuaderno-profe-sync.cuaderno-alvar-x100.workers.dev'
      const FORCE_KEY = 'cuaderno_force_cloud_restore'
      const SETTINGS_KEY = 'cloudSyncSettings'
      const META_KEY = 'cloudSyncMeta'
      const INIT_KEY = 'cuaderno_initialized'

      const apiBaseUrl = document.getElementById('apiBaseUrl')
      const spaceId = document.getElementById('spaceId')
      const secret = document.getElementById('secret')
      const restore = document.getElementById('restore')
      const openApp = document.getElementById('openApp')
      const status = document.getElementById('status')

      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')
        apiBaseUrl.value = saved.apiBaseUrl || DEFAULT_API
        spaceId.value = saved.spaceId || ''
        secret.value = saved.secret || ''
      } catch {
        apiBaseUrl.value = DEFAULT_API
      }

      function setStatus(message) {
        status.textContent = message
      }

      function endpoint(path) {
        const base = (apiBaseUrl.value || DEFAULT_API).trim().replace(/\/+$/, '')
        if (base.endsWith('/api/cloud')) return `${base}/${path}`
        if (base.endsWith('/api')) return `${base}/cloud/${path}`
        return `${base}/api/cloud/${path}`
      }

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          apiBaseUrl: (apiBaseUrl.value || DEFAULT_API).trim(),
          spaceId: spaceId.value.trim(),
          secret: secret.value,
          autoSync: true
        }))
        localStorage.setItem(FORCE_KEY, '1')
        localStorage.removeItem(META_KEY)
        localStorage.removeItem(INIT_KEY)
      }

      function deleteDbWithTimeout() {
        return new Promise(resolve => {
          let settled = false
          const finish = result => {
            if (settled) return
            settled = true
            resolve(result)
          }
          const request = indexedDB.deleteDatabase('CuadernoProfe')
          request.onsuccess = () => finish('borrada')
          request.onerror = () => finish('no borrada, pero forzaremos restauracion')
          request.onblocked = () => finish('bloqueada por otra pestaña, pero forzaremos restauracion')
          setTimeout(() => finish('sin respuesta del navegador, pero forzaremos restauracion'), 2500)
        })
      }

      async function verifyServer() {
        const url = `${endpoint('load')}?spaceId=${encodeURIComponent(spaceId.value.trim())}&secret=${encodeURIComponent(secret.value)}&t=${Date.now()}`
        const response = await fetch(url, { cache: 'no-store' })
        const payload = await response.json()
        if (!response.ok) throw new Error(payload && payload.error ? payload.error : 'No se pudo leer el servidor')
        const backup = payload.backup || {}
        return {
          students: Array.isArray(backup.students) ? backup.students.length : 0,
          groups: Array.isArray(backup.classGroups) ? backup.classGroups.length : 0,
          templates: Array.isArray(backup.templates) ? backup.templates.length : 0,
        }
      }

      restore.addEventListener('click', async () => {
        if (!spaceId.value.trim() || !secret.value) {
          setStatus('Falta espacio docente o clave.')
          return
        }

        restore.disabled = true
        try {
          setStatus('Comprobando servidor...')
          const counts = await verifyServer()
          setStatus(`Servidor OK: ${counts.students} alumnos, ${counts.groups} grupos, ${counts.templates} rubricas. Preparando movil...`)
          saveSettings()
          const deleteResult = await deleteDbWithTimeout()
          setStatus(`Base local ${deleteResult}. Abriendo app para restaurar...`)
          setTimeout(() => {
            window.location.href = './?v=8#/'
          }, 900)
        } catch (error) {
          setStatus(error.message || String(error))
          restore.disabled = false
        }
      })

      openApp.addEventListener('click', () => {
        saveSettings()
        window.location.href = './?v=8#/'
      })
    </script>
  </body>
</html>
